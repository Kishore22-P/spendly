<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#164B3B">
  <title>Reset Password — Spendly</title>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('spendly_theme') || 'light');</script>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./assets/images/favicon.png">
  <link rel="apple-touch-icon" href="./assets/images/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=5">
  <link rel="stylesheet" href="./css/auth.css?v=5">
</head>
<body class="auth-page" data-auth-page="forgot">
  <main class="auth-shell page-enter">
    <div class="auth-brand">
      <a href="index.html" class="auth-brand-logo-wrap" aria-label="Spendly Home">
        <img src="./assets/images/logo.png" alt="Spendly — Track Your Money. Control Your Spending." class="auth-brand-logo">
      </a>
    </div>

    <div id="firebaseConfigBanner" class="firebase-setup-banner hidden">
      <div><strong>Setup Needed:</strong> Paste your Firebase Web App config into <code>js/firebase.js</code> to send reset emails.</div>
    </div>

    <section class="auth-card">
      <h1 class="auth-heading">Forgot password?</h1>
      <p class="auth-subheading">Enter your registered email and we'll send you a reset link.</p>

      <div id="authStatus" class="auth-status hidden" role="alert"></div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="forgotEmail">Registered Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input type="email" id="forgotEmail" class="form-control has-left-icon" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>

        <button type="submit" id="forgotSubmitBtn" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>

      <p class="auth-footer">
        Remember your password? <a href="login.html" class="auth-link">Back to Sign In</a>
      </p>
    </section>
  </main>

  <script type="module" src="./js/auth.js?v=5"></script>
</body>
</html>
