<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#164B3B">
  <title>Create Account — Spendly</title>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('spendly_theme') || 'light');</script>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./assets/images/favicon.png">
  <link rel="apple-touch-icon" href="./assets/images/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=5">
  <link rel="stylesheet" href="./css/auth.css?v=5">
</head>
<body class="auth-page" data-auth-page="register">
  <main class="auth-shell page-enter">
    <div class="auth-brand">
      <a href="index.html" class="auth-brand-logo-wrap" aria-label="Spendly Home">
        <img src="./assets/images/logo.png" alt="Spendly — Track Your Money. Control Your Spending." class="auth-brand-logo">
      </a>
    </div>

    <div id="firebaseConfigBanner" class="firebase-setup-banner hidden">
      <div><strong>Setup Needed:</strong> Paste your Firebase Web App config into <code>js/firebase.js</code> to create an account.</div>
    </div>

    <section class="auth-card">
      <h1 class="auth-heading">Create your account</h1>
      <p class="auth-subheading">Start tracking your daily expenses in seconds.</p>

      <div id="authStatus" class="auth-status hidden" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="regName">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="regName" class="form-control has-left-icon" placeholder="Aarav Sharma" autocomplete="name" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input type="email" id="regEmail" class="form-control has-left-icon" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="regPassword" class="form-control has-left-icon has-right-btn" placeholder="Min. 6 characters" autocomplete="new-password" required>
            <button type="button" class="input-action-btn" data-toggle-password="regPassword" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="regConfirmPassword" class="form-control has-left-icon has-right-btn" placeholder="Re-enter password" autocomplete="new-password" required>
            <button type="button" class="input-action-btn" data-toggle-password="regConfirmPassword" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <div class="auth-divider">or continue with</div>

      <button type="button" id="googleSignInBtn" class="btn btn-google btn-block">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/><path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/></svg>
        Continue with Google
      </button>

      <p class="auth-footer">
        Already have an account? <a href="login.html" class="auth-link">Sign in</a>
      </p>
    </section>
  </main>

  <script>
    if (window.location.protocol === 'file:') {
      var s = document.getElementById('authStatus');
      if (s) {
        s.classList.remove('hidden');
        s.innerHTML = '<div class="alert alert-danger"><div><strong>Local Server Required:</strong> Open this app using <code>http://localhost:8080/register.html</code> (for example via <code>python -m http.server 8080</code>), not by opening the HTML file directly.</div></div>';
      }
    }
  </script>
  <script type="module" src="./js/auth.js?v=5"></script>
</body>
</html>
